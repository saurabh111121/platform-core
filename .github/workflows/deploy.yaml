name: Deploy — Trigger Jenkins

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [beta, gamma, prod]
      service_name:
        description: Service to deploy
        required: true
        type: string
      image_tag:
        description: Image tag to deploy
        required: true
        type: string

permissions:
  contents: read

jobs:
  trigger-jenkins:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins Deploy pipeline
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.JENKINS_URL }}/job/platform-core-ci/buildWithParameters" \
            --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}" \
            --data-urlencode "SERVICE_NAME=${{ inputs.service_name }}" \
            --data-urlencode "ENVIRONMENT=${{ inputs.environment }}" \
            --data-urlencode "IMAGE_TAG=${{ inputs.image_tag }}" \
            --data-urlencode "GIT_BRANCH=main" \
            --data-urlencode "DEPLOY=true" \
            --data-urlencode "INFRA_APPLY=false")

          echo "Jenkins response: $RESPONSE"
          if [ "$RESPONSE" != "201" ] && [ "$RESPONSE" != "200" ]; then
            echo "Failed to trigger Jenkins deploy job (HTTP $RESPONSE)"
            exit 1
          fi
          echo "Jenkins Deploy job triggered for ${{ inputs.environment }}"

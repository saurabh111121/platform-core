name: Infrastructure

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [beta, gamma, prod]
  push:
    branches: [main]
    paths: [terraform/**]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-west-2
  TF_DIR: terraform

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.TF_DIR }}
      - name: Terraform Plan
        run: terraform plan -var="environment=${{ inputs.environment || 'beta' }}" -out=tfplan
        working-directory: ${{ env.TF_DIR }}
      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}/tfplan

  apply:
    needs: plan
    runs-on: ubuntu-latest
    # Manual approval enforced via environment protection rules
    environment: ${{ inputs.environment || 'beta' }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: ${{ env.TF_DIR }}
      - name: Terraform Init
        run: terraform init
        working-directory: ${{ env.TF_DIR }}
      - name: Terraform Apply
        run: terraform apply tfplan
        working-directory: ${{ env.TF_DIR }}

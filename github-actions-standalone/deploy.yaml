name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [beta, gamma, prod]
      service_name:
        description: Service to deploy
        required: true
        type: string
      image_tag:
        description: Image tag to deploy
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Environment protection rules (approvals, wait timers) configured in repo settings
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Update kubeconfig
        run: aws eks update-kubeconfig --name ${{ vars.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }}
      - name: Deploy with Kustomize
        run: |
          cd kubernetes/overlays/${{ inputs.environment }}
          kustomize edit set image ${{ inputs.service_name }}=${{ vars.ECR_REGISTRY }}/${{ inputs.service_name }}:${{ inputs.image_tag }}
          kubectl apply -k .

name: Infrastructure — Trigger Jenkins

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [beta, gamma, prod]
  push:
    branches: [main]
    paths: [terraform/**]

permissions:
  contents: read

jobs:
  trigger-jenkins:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins Infra pipeline
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.JENKINS_URL }}/job/platform-core/buildWithParameters" \
            --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}" \
            --data-urlencode "ENVIRONMENT=${{ inputs.environment || 'beta' }}" \
            --data-urlencode "GIT_BRANCH=main" \
            --data-urlencode "DEPLOY=false" \
            --data-urlencode "INFRA_APPLY=true")

          echo "Jenkins response: $RESPONSE"
          if [ "$RESPONSE" != "201" ] && [ "$RESPONSE" != "200" ]; then
            echo "Failed to trigger Jenkins infra job (HTTP $RESPONSE)"
            exit 1
          fi
          echo "Jenkins Infra job triggered for ${{ inputs.environment || 'beta' }}"

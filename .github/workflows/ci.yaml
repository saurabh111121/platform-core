name: CI — Trigger Jenkins

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string
      dockerfile_path:
        required: false
        type: string
        default: Dockerfile

permissions:
  contents: read

jobs:
  trigger-jenkins:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins CI pipeline
        run: |
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.JENKINS_URL }}/job/platform-core/buildWithParameters" \
            --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_API_TOKEN }}" \
            --data-urlencode "SERVICE_NAME=${{ inputs.service_name || 'app' }}" \
            --data-urlencode "DOCKERFILE_PATH=${{ inputs.dockerfile_path || 'Dockerfile' }}" \
            --data-urlencode "GIT_COMMIT=${{ github.sha }}" \
            --data-urlencode "GIT_BRANCH=${{ github.ref_name }}" \
            --data-urlencode "DEPLOY=false" \
            --data-urlencode "INFRA_APPLY=false")

          echo "Jenkins response: $RESPONSE"
          if [ "$RESPONSE" != "201" ] && [ "$RESPONSE" != "200" ]; then
            echo "Failed to trigger Jenkins job (HTTP $RESPONSE)"
            exit 1
          fi
          echo "Jenkins CI job triggered successfully"
